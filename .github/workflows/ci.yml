name: CI

on:
  push:
    branches:
      - main
      - 'phase-*/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test
        run: |
          dotnet test tests/HiveMind.Core.Tests -c Release
          dotnet test tests/HiveMind.Analyzers.Tests -c Release
          dotnet test tests/HiveMind.Policy.Tests -c Release

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Check the build machine
        run: pwsh -File eng/Setup-DevMachine.ps1 -CheckOnly
      - name: Restore
        run: dotnet restore HiveMind.slnx --locked-mode
      - name: Build
        run: dotnet build HiveMind.slnx -c Release --no-restore
      - name: Test
        run: dotnet test HiveMind.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: artifacts/test-results

  windows-arm64-tests:
    # ARM64 tests (spec section 12.2). GitHub's windows-11-arm runner is free for public
    # repositories only, so a private copy of the repository skips this job.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore HiveMind.slnx --locked-mode
      - name: Build
        run: dotnet build HiveMind.slnx -c Release --no-restore
      - name: Test
        run: dotnet test HiveMind.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
